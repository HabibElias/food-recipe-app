query GetRecipe($id: Int!) {
  recipe(where: { id: { _eq: $id } }) {
    id
    title
    description
    is_paid
    user_id
    price
    prep_time
    category {
      id
      category_name
    }
    user {
      username
      avatar_url
      FirstName
      LastName
      bio
    }
    recipe_ratings_aggregate {
      aggregate {
        avg {
          rating
        }
      }
    }
    recipe_ratings {
      user {
        FirstName
        username
        avatar_url
      }
      rating
    }
    recipe_steps(order_by: { step_no: asc }) {
      id
      step_no
      step_description
    }
    recipe_ingredients {
      id
      ingredient
    }
    recipe_images(order_by: [{ is_thumbnail: desc }, { id: asc }]) {
      id
      img_url
      is_thumbnail
    }
    recipe_likes_aggregate {
      aggregate {
        count
      }
    }
    recipe_comments(order_by: { created_at: desc }) {
      id
      comment_body
      created_at
      user {
        username
        FirstName
        avatar_url
      }
    }
  }
}
